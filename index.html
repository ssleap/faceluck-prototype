<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/faceluck-prototype/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Faceluck 무비용 관상·궁합 UX 테스트 프로토타입">
  <!-- 상용 배포 시 Kakao Developers JavaScript 키를 설정합니다. -->
  <meta name="faceluck-kakao-js-key" content="">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Faceluck Demo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Faceluck Prototype</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
  <script>
    window.faceluckShareToKakao = async function(title, description, url) {
      const metaKey = document.querySelector('meta[name="faceluck-kakao-js-key"]')?.content || '';
      const kakaoKey = window.FACELUCK_KAKAO_JS_KEY || metaKey;

      if (window.Kakao && kakaoKey) {
        try {
          if (!window.Kakao.isInitialized()) window.Kakao.init(kakaoKey);
          await window.Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title: title,
              description: description,
              imageUrl: new URL('icons/Icon-512.png', document.baseURI).href,
              link: { mobileWebUrl: url, webUrl: url }
            },
            buttons: [{
              title: '내 관상과 궁합 보기',
              link: { mobileWebUrl: url, webUrl: url }
            }]
          });
          return 'kakao';
        } catch (error) {
          console.warn('Kakao Share fallback:', error);
        }
      }

      if (navigator.share) {
        try {
          await navigator.share({ title: title, text: description, url: url });
          return 'nativeShare';
        } catch (error) {
          if (error && error.name === 'AbortError') return 'cancelled';
          console.warn('Native Share unavailable:', error);
          return 'unavailable';
        }
      }

      return 'unavailable';
    };
  </script>
</head>
<body>
  <script type="module" src="faceluck_face_detector.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
